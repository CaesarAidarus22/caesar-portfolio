<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121a30"/>
      <stop offset="1" stop-color="#090f1f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" x2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <!-- input waveform -->
  <g transform="translate(160 150)">
    <circle cx="44" cy="60" r="44" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa" stroke-opacity="0.5"/>
    <rect x="32" y="34" width="24" height="38" rx="12" fill="none" stroke="#c4b5fd" stroke-width="4"/>
    <path d="M24 62a20 20 0 0 0 40 0M44 82v12" stroke="#c4b5fd" stroke-width="4" fill="none" stroke-linecap="round"/>
    <g fill="url(#wave)">
      <rect x="130" y="50" width="10" height="20" rx="5"/><rect x="152" y="36" width="10" height="48" rx="5"/>
      <rect x="174" y="20" width="10" height="80" rx="5"/><rect x="196" y="40" width="10" height="40" rx="5"/>
      <rect x="218" y="10" width="10" height="100" rx="5"/><rect x="240" y="30" width="10" height="60" rx="5"/>
      <rect x="262" y="46" width="10" height="28" rx="5"/><rect x="284" y="16" width="10" height="88" rx="5"/>
      <rect x="306" y="34" width="10" height="52" rx="5"/><rect x="328" y="50" width="10" height="20" rx="5"/>
      <rect x="350" y="24" width="10" height="72" rx="5"/><rect x="372" y="6" width="10" height="108" rx="5"/>
      <rect x="394" y="36" width="10" height="48" rx="5"/><rect x="416" y="20" width="10" height="80" rx="5"/>
      <rect x="438" y="44" width="10" height="32" rx="5"/><rect x="460" y="28" width="10" height="64" rx="5"/>
      <rect x="482" y="50" width="10" height="20" rx="5"/><rect x="504" y="38" width="10" height="44" rx="5"/>
      <rect x="526" y="14" width="10" height="92" rx="5"/><rect x="548" y="44" width="10" height="32" rx="5"/>
      <rect x="570" y="52" width="10" height="16" rx="5"/>
    </g>
  </g>

  <!-- transcript with language tags -->
  <g transform="translate(860 150)" font-size="28">
    <rect width="580" height="120" rx="24" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <g transform="translate(28 38)">
      <rect width="96" height="46" rx="10" fill="#a78bfa" fill-opacity="0.2"/><text x="48" y="32" text-anchor="middle" fill="#ddd6fe">aku</text>
      <rect x="108" width="140" height="46" rx="10" fill="#a78bfa" fill-opacity="0.2"/><text x="178" y="32" text-anchor="middle" fill="#ddd6fe">lagi</text>
      <rect x="260" width="120" height="46" rx="10" fill="#22d3ee" fill-opacity="0.18"/><text x="320" y="32" text-anchor="middle" fill="#a5f3fc">busy</text>
      <rect x="392" width="140" height="46" rx="10" fill="#22d3ee" fill-opacity="0.18"/><text x="462" y="32" text-anchor="middle" fill="#a5f3fc">today</text>
    </g>
    <text x="28" y="160" font-size="18" letter-spacing="3" fill="#c4b5fd">● ID</text>
    <text x="110" y="160" font-size="18" letter-spacing="3" fill="#67e8f9">● EN</text>
  </g>

  <!-- pipeline -->
  <text x="160" y="440" font-size="20" letter-spacing="6" fill="#94a3b8">END-TO-END PIPELINE</text>
  <g font-size="24" text-anchor="middle">
    <g stroke="#a78bfa" stroke-width="3" stroke-opacity="0.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M350 600H425M415 590l10 10l-10 10"/>
      <path d="M625 600H700M690 590l10 10l-10 10"/>
      <path d="M900 600H975M965 590l10 10l-10 10"/>
      <path d="M1175 600H1250M1240 590l10 10l-10 10"/>
    </g>
    <g transform="translate(250 600)">
      <rect x="-90" y="-90" width="180" height="180" rx="36" fill="#a78bfa" fill-opacity="0.14" stroke="#a78bfa" stroke-opacity="0.55"/>
      <path d="M-30 -20v40M-15 -34v68M0 -12v24M15 -28v56M30 -16v32" stroke="#c4b5fd" stroke-width="6" stroke-linecap="round"/>
      <text y="140" fill="#e2e8f0">Transcribe</text>
    </g>
    <g transform="translate(525 600)">
      <rect x="-90" y="-90" width="180" height="180" rx="36" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.16"/>
      <path d="M-32 -24h64M-32 0h44M-32 24h56" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
      <text y="140" fill="#e2e8f0">Normalize</text>
    </g>
    <g transform="translate(800 600)">
      <rect x="-90" y="-90" width="180" height="180" rx="36" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="-22" y="-2" font-size="30" font-weight="700" fill="#c4b5fd">ID</text>
      <text x="22" y="36" font-size="30" font-weight="700" fill="#67e8f9">EN</text>
      <text y="140" fill="#e2e8f0">Language Tag</text>
    </g>
    <g transform="translate(1075 600)">
      <rect x="-90" y="-90" width="180" height="180" rx="36" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.16"/>
      <path d="M0 -38C4 -10 10 -4 38 0C10 4 4 10 0 38C-4 10 -10 4 -38 0C-10 -4 -4 -10 0 -38Z" fill="#a5b4fc"/>
      <text y="140" fill="#e2e8f0">Generate</text>
    </g>
    <g transform="translate(1350 600)">
      <rect x="-90" y="-90" width="180" height="180" rx="36" fill="#a78bfa" fill-opacity="0.14" stroke="#a78bfa" stroke-opacity="0.55"/>
      <path d="M-34 -14h14l20 -18v64l-20 -18h-14z" fill="#c4b5fd"/>
      <path d="M14 -16a24 24 0 0 1 0 32M26 -28a40 40 0 0 1 0 56" stroke="#67e8f9" stroke-width="5" fill="none" stroke-linecap="round"/>
      <text y="140" fill="#e2e8f0">Speak</text>
    </g>
  </g>

  <g transform="translate(160 840)" font-size="20" fill="#64748b">
    <text>audio in  →  text  →  clean text  →  tagged tokens  →  response  →  audio out</text>
  </g>
</svg>
